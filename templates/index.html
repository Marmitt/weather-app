<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="overlay"></div>
  <div class="weather-container">
    <form class="search-bar" onsubmit="getWeather(); return false;">
      <input type="text" id="cityInput" placeholder="Search for a city..." autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <div class="weather-card d-none" id="weatherCard">
      <h1 id="cityName">Sydney</h1>
      <h2 id="temperature">22°C</h2>
      <p id="description">Cloudy</p>

      <div class="forecast" id="forecastTiles">
        <!-- Forecast tiles will go here -->
      </div>
    </div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value.trim();
      if (!city) return;

      const res = await fetch(`/weather?city=${city}`);
      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      document.getElementById("cityName").innerText = data.city;
      document.getElementById("temperature").innerText = `${Math.round(data.current.temperature)}°C`;
      document.getElementById("description").innerText = data.condition;

      const forecastDiv = document.getElementById("forecastTiles");
      forecastDiv.innerHTML = "";

      for (let i = 0; i < 3; i++) {
        forecastDiv.innerHTML += `
          <div class="forecast-tile">
            <div class="date">${data.daily.time[i]}</div>
            <div class="temp">↑ ${data.daily.temperature_2m_max[i]}°C</div>
            <div class="temp">↓ ${data.daily.temperature_2m_min[i]}°C</div>
          </div>
        `;
      }

      document.getElementById("weatherCard").classList.remove("d-none");
    }
  </script>
</body>
</html>
