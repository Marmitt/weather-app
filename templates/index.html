<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light text-dark">
  <div class="container mt-4">
    <h1 class="mb-4 text-center">🌍 World Weather Dashboard</h1>
    <input type="text" id="cityInput" placeholder="Enter city name" class="form-control mb-3" />
    <button onclick="getWeather()" class="btn btn-primary w-100">Get Weather</button>
    <div id="weatherResult" class="mt-4"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      const res = await fetch(`/weather?city=${city}`);
      const data = await res.json();
      const result = document.getElementById("weatherResult");

      if (data.error) {
        result.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
      } else {
        result.innerHTML = `
          <h3>${data.city.name}, ${data.city.country}</h3>
          <p><strong>Temperature:</strong> ${data.list[0].main.temp}°C</p>
          <p><strong>Condition:</strong> ${data.list[0].weather[0].description}</p>
        `;
      }
    }
  </script>
</body>
</html>
