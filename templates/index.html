<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
    }
    .weather-card {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    .detail-box {
      background-color: rgba(255,255,255,0.08);
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
    }
    input {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
    }
    input::placeholder {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container d-flex flex-column align-items-center justify-content-center py-5">
    <h1 class="mb-4 text-center">🌍 Weather Forecast</h1>

    <div class="input-group mb-4 w-75">
      <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
      <button onclick="getWeather()" class="btn btn-light">Search</button>
    </div>

    <div id="weatherResult" class="weather-card w-100 text-center d-none">
      <h2 id="cityName"></h2>
      <h3 id="temperature"></h3>
      <p id="description"></p>

      <div class="details-grid mt-4">
        <div class="detail-box">
          <h5>Wind</h5>
          <p id="wind"></p>
        </div>
        <div class="detail-box">
          <h5>Weather Code</h5>
          <p id="code"></p>
        </div>
        <div class="detail-box">
          <h5>Lat / Lon</h5>
          <p id="coords"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      const res = await fetch(`/weather?city=${city}`);
      const data = await res.json();

      const card = document.getElementById("weatherResult");

      if (data.error) {
        card.classList.add("d-none");
        alert(data.error);
        return;
      }

      document.getElementById("cityName").innerText = data.city;
      document.getElementById("temperature").innerText = `${data.current.temperature}°C`;
      document.getElementById("description").innerText = "Current weather condition";
      document.getElementById("wind").innerText = `${data.current.windspeed} km/h`;
      document.getElementById("code").innerText = data.current.weathercode;
      document.getElementById("coords").innerText = `${parseFloat(data.lat).toFixed(2)}, ${parseFloat(data.lon).toFixed(2)}`;

      card.classList.remove("d-none");
    }
  </script>
</body>
</html>
