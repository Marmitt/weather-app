<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
  <div class="container d-flex flex-column align-items-center justify-content-center py-5">
    <h1 class="mb-4 text-center">🌍 Weather Forecast</h1>

    <div class="input-group mb-4 w-75">
      <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
      <button onclick="getWeather()" class="btn btn-light">Search</button>
    </div>

    <div id="loading" class="text-center d-none mt-3">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="weatherResult" class="weather-card w-100 text-center d-none">
      <h2 id="cityName"></h2>
      <lottie-player id="weatherLottie" autoplay loop style="height: 120px;"></lottie-player>
      <h3 id="temperature"></h3>
      <p id="description"></p>

      <div class="details-grid">
        <div class="detail-box">
          <h5>Wind</h5>
          <p id="wind"></p>
        </div>
        <div class="detail-box">
          <h5>Condition</h5>
          <p id="code"></p>
        </div>
        <div class="detail-box">
          <h5>Lat / Lon</h5>
          <p id="coords"></p>
        </div>
      </div>

      <div class="row mt-4" id="forecastTiles"></div>
    </div>
  </div>

  <script>
    const lottieMap = {
      "Clear sky ☀️": "https://assets8.lottiefiles.com/packages/lf20_jmBauI.json",
      "Mainly clear 🌤️": "https://assets4.lottiefiles.com/private_files/lf30_tljjah7g.json",
      "Partly cloudy ⛅": "https://assets2.lottiefiles.com/private_files/lf30_jo3p8kie.json",
      "Overcast ☁️": "https://assets6.lottiefiles.com/packages/lf20_xlkxtmul.json",
      "Light rain 🌧️": "https://assets10.lottiefiles.com/packages/lf20_xzgLBm.json",
      "Thunderstorm ⛈️": "https://assets2.lottiefiles.com/packages/lf20_yqytzn0m.json"
    };

    async function getWeather() {
      const city = document.getElementById("cityInput").value;
      document.getElementById("loading").classList.remove("d-none");
      document.getElementById("weatherResult").classList.add("d-none");

      try {
        const res = await fetch(`/weather?city=${city}`);
        const data = await res.json();
        document.getElementById("loading").classList.add("d-none");

        if (data.error) {
          alert(data.error);
          return;
        }

        document.getElementById("cityName").innerText = data.city;
        document.getElementById("temperature").innerText = `${data.current.temperature}°C`;
        document.getElementById("description").innerText = data.condition;
        document.getElementById("wind").innerText = `${data.current.windspeed} km/h`;
        document.getElementById("code").innerText = data.condition;
        document.getElementById("coords").innerText = `${parseFloat(data.lat).toFixed(2)}, ${parseFloat(data.lon).toFixed(2)}`;

        const lottieURL = lottieMap[data.condition] || "";
        document.getElementById("weatherLottie").setAttribute("src", lottieURL);

        let forecastHTML = "";
        for (let i = 0; i < 3; i++) {
          forecastHTML += `
            <div class="col-md-4">
              <div class="card bg-secondary text-light mb-3">
                <div class="card-body">
                  <h5 class="card-title">${data.daily.time[i]}</h5>
                  <p>🌡 Max: ${data.daily.temperature_2m_max[i]}°C</p>
                  <p>🌡 Min: ${data.daily.temperature_2m_min[i]}°C</p>
                </div>
              </div>
            </div>
          `;
        }
        document.getElementById("forecastTiles").innerHTML = forecastHTML;

        document.getElementById("weatherResult").classList.remove("d-none");

      } catch (err) {
        alert("Failed to fetch weather!");
        document.getElementById("loading").classList.add("d-none");
      }
    }
  </script>
</body>
</html>
