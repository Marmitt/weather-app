<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>body { background-image: url('/static/img/cloudy_day.jpg'); }</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="weather-container">
    <h1 class="d-none app-title" id="appTitle">Weather App</h1>
    <form class="search-bar" onsubmit="getWeather(); return false;">
      <input type="text" id="cityInput" placeholder="Search for a city..." autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <div class="weather-card d-none" id="weatherCard">
      <h1 id="cityName"></h1>
      <h2 id="temperature"></h2>
      <p id="description"></p>

      <div class="forecast d-none" id="extraTiles" style="margin-bottom: 1.5rem;">
        <div class="forecast-tile">
          <div class="date">Feels Like</div>
          <div class="temp" id="feelsLikeBox"></div>
        </div>
        <div class="forecast-tile">
          <div class="date">Wind</div>
          <div class="temp" id="windBox"></div>
        </div>
        <div class="forecast-tile">
          <div class="date">Local Time</div>
          <div class="temp" id="localTimeBox"></div>
        </div>
      </div>

      <div class="forecast d-none" id="forecastTiles">
        <div class="forecast-tile">
          <div class="date" id="day1"></div>
          <div class="temp" id="max1"></div>
          <div class="temp" id="min1"></div>
        </div>
        <div class="forecast-tile">
          <div class="date" id="day2"></div>
          <div class="temp" id="max2"></div>
          <div class="temp" id="min2"></div>
        </div>
        <div class="forecast-tile">
          <div class="date" id="day3"></div>
          <div class="temp" id="max3"></div>
          <div class="temp" id="min3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toTitleCase(str) {
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    async function getWeather() {
      const cityInput = document.getElementById("cityInput").value.trim();
      if (!cityInput) return;

      const city = toTitleCase(cityInput);

      const res = await fetch(`/weather?city=${city}`);
      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      const isDay = data.current.is_day === 1;

      const bgMap = {
        "Clear sky ☀️": isDay ? "/static/img/sunny_day.jpg" : "/static/img/sunny_night.jpg",
        "Mainly clear 🌤️": isDay ? "/static/img/sunny_day.jpg" : "/static/img/sunny_night.jpg",
        "Partly cloudy ⛅": isDay ? "/static/img/cloudy_day.jpg" : "/static/img/cloudy_night.jpg",
        "Overcast ☁️": isDay ? "/static/img/cloudy_day.jpg" : "/static/img/cloudy_night.jpg",
        "Light rain 🌧️": isDay ? "/static/img/rainy_day.jpg" : "/static/img/rainy_night.jpg",
        "Thunderstorm ⛈️": isDay ? "/static/img/rainy_day.jpg" : "/static/img/rainy_night.jpg",
        "Snow fall ❄️": isDay ? "/static/img/snow_day.jpg" : "/static/img/snow_night.jpg"
      };

      document.body.style.backgroundImage = `url('${bgMap[data.condition] || "/static/img/cloudy_day.jpg"}')`;

      document.getElementById("cityName").innerText = city;
      document.getElementById("temperature").innerText = `${Math.round(data.current.temperature)}°C`;
      document.getElementById("description").innerText = data.condition;

      const localTime = new Date(data.current.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById("feelsLikeBox").innerText = `${Math.round(data.current.apparent_temperature)}°C`;
      document.getElementById("windBox").innerText = `${data.current.windspeed} km/h`;
      document.getElementById("localTimeBox").innerText = localTime;

      document.getElementById("day1").innerText = data.daily.time[0];
      document.getElementById("max1").innerText = `↑ ${data.daily.temperature_2m_max[0]}°C`;
      document.getElementById("min1").innerText = `↓ ${data.daily.temperature_2m_min[0]}°C`;

      document.getElementById("day2").innerText = data.daily.time[1];
      document.getElementById("max2").innerText = `↑ ${data.daily.temperature_2m_max[1]}°C`;
      document.getElementById("min2").innerText = `↓ ${data.daily.temperature_2m_min[1]}°C`;

      document.getElementById("day3").innerText = data.daily.time[2];
      document.getElementById("max3").innerText = `↑ ${data.daily.temperature_2m_max[2]}°C`;
      document.getElementById("min3").innerText = `↓ ${data.daily.temperature_2m_min[2]}°C`;

      document.getElementById("appTitle").classList.remove("d-none");
      document.getElementById("extraTiles").classList.remove("d-none");
      document.getElementById("forecastTiles").classList.remove("d-none");
      document.getElementById("weatherCard").classList.remove("d-none");
    }
  </script>
</body>
</html>
